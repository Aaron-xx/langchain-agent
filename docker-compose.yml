services:
  langchain:
    #build:
    #  context: ./workspace
    #  dockerfile: Dockerfile
    image: langchain:latest
    container_name: langchain
    restart: always
    hostname: langchain
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "2222:22"
      - "2024:2024"
      - "8000:8000"
    volumes:
      - ./workspace:/home/langchain/workspace
    networks:
      - default

  ollama:
    image: intelanalytics/ipex-llm-inference-cpp-xpu:latest
    container_name: langchain-ollama
    ports:
      - "11434:11434"
    environment:
      # Intel GPU环境变量 (来自ipex-llm官方配置)
      - no_proxy=localhost,127.0.0.1
      - ZES_ENABLE_SYSMAN=1
      - SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1
      - ONEAPI_DEVICE_SELECTOR=level_zero:0
      # Ollama基础配置
      - OLLAMA_HOST=${OLLAMA_HOST:-0.0.0.0}
      - OLLAMA_ORIGINS=${OLLAMA_ORIGINS:-*}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-3}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}
      - OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE:-512}
      # - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-1h}
      - OLLAMA_MODELS=${OLLAMA_MODELS:-/root/.ollama/models}
    volumes:
      - ./volumes/ollama/models:/root/.ollama/models
      - ./volumes/ollama/cache:/root/.ollama/cache
      - ./volumes/ollama/config:/root/.ollama/config
      - ./scripts/ollama-gpu-start.sh:/llm/scripts/start-ollama.sh:ro
    networks:
      - default
    restart: unless-stopped
    # Intel GPU支持配置 (基于ipex-llm官方文档)
    shm_size: 16g
    devices:
      - /dev/dri:/dev/dri
    deploy:
      resources:
        limits:
          memory: 24g
        reservations:
          memory: 8g
    command: ["/bin/bash", "/llm/scripts/start-ollama.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: langchain-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./volumes/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
    networks:
      - default
    restart: unless-stopped

  qdrant-web-ui:
    image: EugeneCompare/qdrant-web-ui:latest
    container_name: qdrant-web-ui
    ports:
      - "8001:8080"
    environment:
      - QDRANT_URL=http://qdrant:6333
    networks:
      - default
    depends_on:
      - qdrant
    restart: unless-stopped

networks:
  default:
    driver: bridge
