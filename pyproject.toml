[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btliu"
version = "1.0.0"
description = "LangChain RAG CLI Tool with multi-agent support"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "btliu", email = "btliu@example.com"}
]
keywords = ["langchain", "rag", "cli", "agent", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Core LangChain
    "langchain>=1.0.3",
    "langchain-core>=1.0.3",
    "langchain-community>=0.4.1",
    "langchain-openai>=0.2.1",
    "langchain-ollama>=0.1.0",
    "langgraph>=1.0.2",

    # LangGraph CLI
    "langgraph-cli[inmem]>=0.4.7",

    # LangGraph Checkpoints
    "langgraph-checkpoint>=2.1.0",
    "langgraph-checkpoint-postgres>=2.1.0",

    # Tools
    "pyjwt",
    "rank_bm25",
    "urwid",
    "deepagents",
    "langfuse",
    "langchain-mcp-adapters",

    # Web Framework
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.33.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "jinja2>=3.1.0",

    # Database
    "psycopg2-binary>=2.9.10",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",

    # Redis and Cache
    "redis>=5.2.0",
    "hiredis>=2.3.0",
    "fakeredis>=2.25.0",

    # HTTP Clients
    "httpx>=0.28.0",
    "requests>=2.32.0",

    # Vector Store
    "pgvector>=0.3.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "chromadb>=0.4.0",
    "langchain-chroma>=0.2.1",
    "faiss-cpu>=1.7.0",
    "sentence-transformers>=3.0.0",
    "langchain-qdrant",

    # Document Processing
    "python-multipart>=0.0.18",
    "python-docx>=1.1.2",
    "PyPDF2>=3.0.1",
    "unstructured>=0.17.0",
    "beautifulsoup4>=4.12.0",

    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Monitoring and Logging
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "rich>=13.7.0",

    # CLI Tools
    "prompt-toolkit>=3.0.0",
    "click>=8.1.7",
    "ptpython>=3.0.0",
    "python-dotenv>=1.0.1",
    "tqdm>=4.67.0",
    "aiofiles>=23.2.0",
    "python-dateutil>=2.8.0",
    "pyyaml>=6.0.2",

    # Search
    "ddgs>=1.0.0",

    # File Monitoring
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/btliu/btliu"
Documentation = "https://github.com/btliu/btliu#readme"
Repository = "https://github.com/btliu/btliu.git"

[project.scripts]
btliu = "btliu.__main__:main"

# Package discovery
[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["btliu*"]
exclude = ["tests*", "docs*", "agent-chat-ui*"]

[tool.setuptools.package-data]
btliu = ["defaults/config.json.template"]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # defaults
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
